# dsh-usage-ledger bundle patch: cross-session token usage accounting and
# cost statistics. Applied after the surface bundle's patch (dsh-web-app),
# before the profile's own cordis.patch.yml and any --patch overlays.
#
# Two host-plane rows:
#   - usage-ledger         the ledger service: records every llm/stream call
#                          into its own SQLite file under $DSH_HOME/storages,
#                          and serves the /api/usage-ledger/* Fetch routes
#   - usage-ledger-tool    the model-facing `usage_stats` tool (delete this
#                          row to hide the tool from agents)
#
# No connection override row: dsh 0.2.0-rc.x resolves webServer from the
# connection plugin's own fiber (its apply injects webServer itself, and
# connection.fetch.register never touches webServer), so the inject-only
# override this patch carried for 0.1.5-era builds is obsolete.

- insert:
    - id: usage-ledger
      name: 'dsh-usage-ledger'

    - id: usage-ledger-tool
      name: 'dsh-usage-ledger/tool'
      inject: [usageLedger]
